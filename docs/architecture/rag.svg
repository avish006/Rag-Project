<text x="366" y="764" font-size="18" class="title" text-anchor="start">Original document</text>
<text x="366" y="787" font-size="13" class="muted" text-anchor="start">Per-document PDF file</text>
<text x="366" y="814" font-size="14" class="" text-anchor="start">Rendered as visual evidence</text>
<text x="366" y="835" font-size="14" class="" text-anchor="start">Page IDs remain attached</text>
<text x="366" y="856" font-size="14" class="" text-anchor="start">Read from document storage</text>
<rect x="640" y="735" width="250" height="155" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="656" y="764" font-size="18" class="title" text-anchor="start">Evidence validator</text>
<text x="656" y="787" font-size="13" class="muted" text-anchor="start">rag.py</text>
<text x="656" y="814" font-size="14" class="" text-anchor="start">Known IDs and verbatim quotes</text>
<text x="656" y="835" font-size="14" class="" text-anchor="start">Supported cited claims</text>
<text x="656" y="856" font-size="14" class="" text-anchor="start">Whole-question coverage</text>
<rect x="970" y="185" width="280" height="330" rx="10" fill="#f0f3f7" stroke="#adb9c9" stroke-width="1.5"/>
<text x="986" y="214" font-size="18" class="title" text-anchor="start">Google model API</text>
<text x="986" y="237" font-size="13" class="muted" text-anchor="start">Generation and verification / HTTPS</text>
<text x="986" y="264" font-size="14" class="" text-anchor="start">Receives selected text and PNGs</text>
