<polyline points="475,620 475,735" fill="none" stroke="#52657e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="475" y="687" font-size="13" class="label" text-anchor="middle">Read PDF</text>
<polyline points="600,250 970,250" fill="none" stroke="#52657e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="780" y="236" font-size="13" class="label" text-anchor="middle">Generate draft</text>
<polyline points="600,295 620,295 620,700 765,700 765,735" fill="none" stroke="#52657e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="890,815 940,815 940,470 970,470" fill="none" stroke="#52657e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1080" y="554" font-size="13" class="label" text-anchor="middle">Evidence verification</text>
<text x="60" y="930" font-size="14" class="muted" text-anchor="start">The orchestrator invokes evidence validation with schema-validated claims and verification results.</text>
