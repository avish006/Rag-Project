<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc">
<title id="title">DocuMind retrieval and guardrail components</title><desc id="desc">The answer orchestrator uses hybrid retrieval, shared BGE encoding, PDF rendering, strict Pydantic contracts and cited-evidence validation. Generation and per-claim verification call the Google API.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52657e"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#18314f} .muted{fill:#53677f} .title{font-weight:700} .label{paint-order:stroke;stroke:#f8fafc;stroke-width:6;stroke-linejoin:round}</style>
<rect width="1280" height="1020" fill="#f8fafc"/>
<text x="30" y="38" font-size="29" class="title" text-anchor="start">Retrieval and guardrail components</text>
<text x="30" y="66" font-size="16" class="muted" text-anchor="start">Query inputs / question, visitor key, last six turns, page sources and stored vectors</text>
<rect x="30" y="100" width="890" height="860" rx="16" fill="#ffffff" stroke="#dce7f5" stroke-width="2"/>
<text x="50" y="128" font-size="18" class="title" text-anchor="start">Multimodal RAG engine</text>
<text x="50" y="151" font-size="14" class="muted" text-anchor="start">Logical components inside the shared application process</text>
<rect x="350" y="185" width="250" height="165" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="366" y="214" font-size="18" class="title" text-anchor="start">Answer orchestrator</text>
<text x="366" y="237" font-size="13" class="muted" text-anchor="start">rag.py / ask</text>
<text x="366" y="264" font-size="14" class="" text-anchor="start">Selects source evidence</text>
<text x="366" y="285" font-size="14" class="" text-anchor="start">Answer or insufficient</text>
<text x="366" y="306" font-size="14" class="" text-anchor="start">evidence</text>
<text x="366" y="327" font-size="14" class="" text-anchor="start">Errors include trace IDs</text>
<rect x="60" y="430" width="250" height="190" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="76" y="459" font-size="18" class="title" text-anchor="start">Hybrid retrieval</text>
<text x="76" y="482" font-size="13" class="muted" text-anchor="start">rank-bm25 + NumPy</text>
<text x="76" y="509" font-size="14" class="" text-anchor="start">BM25 token ranking</text>
<text x="76" y="530" font-size="14" class="" text-anchor="start">Exact dense cosine search</text>
<text x="76" y="551" font-size="14" class="" text-anchor="start">Reciprocal-rank fusion</text>
<text x="76" y="572" font-size="14" class="" text-anchor="start">5 text windows; 2 visual</text>
<text x="76" y="593" font-size="14" class="" text-anchor="start">pages</text>
<rect x="350" y="430" width="250" height="190" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="366" y="459" font-size="18" class="title" text-anchor="start">Visual renderer</text>
<text x="366" y="482" font-size="13" class="muted" text-anchor="start">PyMuPDF / evidence_parts</text>
<text x="366" y="509" font-size="14" class="" text-anchor="start">Selected PDF page pixels</text>
<text x="366" y="530" font-size="14" class="" text-anchor="start">PNG evidence with source IDs</text>
<text x="366" y="551" font-size="14" class="" text-anchor="start">Long side capped at 1500 px</text>
<rect x="640" y="430" width="250" height="190" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="656" y="459" font-size="18" class="title" text-anchor="start">Output contracts</text>
<text x="656" y="482" font-size="13" class="muted" text-anchor="start">Pydantic / guardrails.py</text>
<text x="656" y="509" font-size="14" class="" text-anchor="start">Strict Claim and Draft fields</text>
<text x="656" y="530" font-size="14" class="" text-anchor="start">Source ID format</text>
<text x="656" y="551" font-size="14" class="" text-anchor="start">Typed per-claim verdicts</text>
<text x="656" y="572" font-size="14" class="" text-anchor="start">Invalid output gives errors</text>
<rect x="60" y="735" width="250" height="155" rx="10" fill="#eaf7f5" stroke="#83b9af" stroke-width="1.5"/>
