<text x="476" y="212" font-size="13" class="muted" text-anchor="start">Visitor API key, notes and theme</text>
<rect x="860" y="160" width="350" height="80" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
<text x="876" y="189" font-size="18" class="title" text-anchor="start">Dashboard</text>
