<text x="50" y="386" font-size="14" class="muted" text-anchor="start">Gunicorn / one application process / four HTTP request threads</text>
<rect x="60" y="410" width="830" height="85" rx="10" fill="#edf3ff" stroke="#90ade0" stroke-width="1.5"/>
