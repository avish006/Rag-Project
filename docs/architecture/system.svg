<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1230" viewBox="0 0 1280 1230" role="img" aria-labelledby="title desc">
<title id="title">DocuMind deployment and component architecture</title><desc id="desc">Browser workspace connects to a single-process Flask application. The backend contains indexing, multimodal RAG, background Ragas evaluation and observability components, with document files, SQLite telemetry and bundled evaluation reports. Google is the external inference provider.</desc>
